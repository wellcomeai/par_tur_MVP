services:
  - type: web
    name: partour
    env: python
    buildCommand: bash build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TWOGIS_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: ""
      - key: VITE_API_URL
        value: ""
