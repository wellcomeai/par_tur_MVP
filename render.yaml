services:
  - type: web
    name: partour-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TWOGIS_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: partour-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        sync: false
